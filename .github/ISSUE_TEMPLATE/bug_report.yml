name: 问题反馈
description: 卡住 / 报错 / 灌入失败 / 界面异常 —— 只需复制粘贴两项内容，其余信息插件已自动收集并脱敏
title: "[反馈] "
body:
  - type: markdown
    attributes:
      value: |
        ## 两步就能提交，不需要填写任何技术细节

        **① 导出配置** → 插件「设置 → 检测」点 **「导出配置」** 按钮，然后粘贴到下面「运行配置」框。
        按钮会把插件版本、运行环境、各项开关一次性打包，并**自动隐去 GitHub Token、代理密码等敏感信息**。

        **② 贴日志** → 复现一次问题，把「源库」页日志区的日志复制过来（出问题前后各 30~50 行即可）。
        日志同样已自动脱敏，其中出现 `**` 的地方就是被隐去的敏感内容。

        > 插件版本、洛雪音源插件是否安装、问题出现在哪一步，插件都已自动带上或可从日志直接看出，**无需你手动判断和填写**。

        > ⚠️ 请不要手动把 GitHub Token 贴进来——它等同于账号凭据。

  - type: textarea
    id: what_happened
    attributes:
      label: 出现了什么问题
      description: 一两句话描述界面上的表现就够了
      placeholder: 点「开始爬取」后进度停在 32/93 不动了，界面也没有任何提示。
    validations:
      required: true

  - type: textarea
    id: config
    attributes:
      label: 运行配置（点「导出配置」按钮后，粘贴到这里）
      description: 内容已自动脱敏，可直接原样粘贴，无需删改
      render: text
      placeholder: |-
        {
          "插件": { "名称": "音源猎手", "版本": "1.4.20", "入口": "lx-hunter" },
          "客户端": { "UA": "…", "屏幕": "2560x1440", "触屏": false },
          "宿主": { "地址形态": "http://<域名>:58091", "洛雪音源插件": "已安装 · 可访问" },
          "网络设置": { "代理": "未配置", "raw 加速镜像": "不使用镜像" },
          "检测设置": { "爬取后自动执行 jsenv 可用性检测": true, "调试模式": true }
        }
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 插件日志
      description: 「源库」页日志区复制，出问题前后各 30~50 行即可；已自动脱敏，可直接粘贴
      render: text
      placeholder: |-
        [03:12:41][系统] 音源猎手插件初始化…（实例 912455）
        [03:12:43][爬取] 开始爬取 30 个仓库…
        [03:12:45][可用性] 可用性检测 93 个音源（jsenv 沙箱）…
    validations:
      required: true

  - type: dropdown
    id: host_env
    attributes:
      label: 宿主环境
      description: 你用什么设备 / 系统打开 Songloft（手机端与桌面端表现差异较大，请如实选择）
      options:
        - 飞牛 fnOS（NAS 网页端）
        - 飞牛 App（手机 / 平板）
        - Windows
        - Docker（群晖 / unRAID / 其它）
        - 群晖 DSM（套件安装）
        - Linux 服务器 / VPS
        - 其它（在「补充说明」里写明）
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明 / 截图（可选）
      description: 其它线索、你试过哪些办法、或者把截图直接拖进这个框
    validations:
      required: false
